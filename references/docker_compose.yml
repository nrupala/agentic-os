services:
  omega-chroma:
    image: chromadb/chroma:latest
    container_name: omega_memory_hub
    volumes:
      - ./chroma_data:/data
    # Bind to localhost only so traffic MUST go through the TLS proxy
    ports:
      - "127.0.0.1:8001:8000"

  omega-tls-proxy:
    image: nginx:alpine
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./system_scripts/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8443:443" # Carrier Encryption Entrypoint

  omega-agent:
    build: .
    environment:
      - CHROMA_URL=https://omega-tls-proxy:443
      - MASTER_KEY_PATH=/app/system_scripts/master.key
